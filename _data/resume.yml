# Single source of truth for /resume/.
# Every item carries `tracks`: which filtered views it appears in.
# Tracks: science, engineering, data, fitness. ("all" view shows everything.)

views:
  - id: all
    label: Everything
    title: Chemist · Engineer · Developer · Founder
    summary: >-
      Multidisciplinary, cross-functional scientist, engineer and developer — curious across chemistry,
      physics, software, AI, philosophy and fitness, but a builder at heart. 10+ years turning ideas into
      working systems: plasma reactors, a DOE-funded CO₂-capture pilot lab, and enterprise data platforms
      for statewide water treatment. Co-founder of Epistemion, an industrial-automation and agentic-AI company.
  - id: science
    label: Science
    title: Analytical & Plasma Chemist
    summary: >-
      Research scientist with 10+ years across analytical chemistry, biochemistry and plasma chemistry.
      Hands-on with HPLC, GC-MS, LC-MS, UV-Vis and isotope-ratio mass spectrometry — operation, method
      development, maintenance and repair. Three peer-reviewed papers (Biochemistry, JCI Insight) and a manuscript
      in preparation; now leading plasma-based synthesis research focused on CO₂ utilization and mentoring students.
  - id: engineering
    label: Engineering
    title: Engineer & Systems Analyst
    summary: >-
      Applied engineer who designs, builds and troubleshoots physical systems — plasma and Joule-heating
      reactors, pulsed power supplies, water-treatment systems across 43+ sites and pilot-scale CO₂ capture. I prototype fixtures and
      measurement rigs by hand, model fluid flow, heat transfer and electromagnetics in Python, and
      iterate until the system performs — at home too, like a closed-loop, AC-chilled cold plunge.
  - id: data
    label: Data & Software
    title: Data Scientist & Software Developer
    summary: >-
      Developer and data scientist who builds tools for real operations: a statewide Flutter app
      that cut reporting time 50%+ for six field chemists, a 50-year water-treatment research database built with
      AI-powered OCR, and scientific simulation software. Co-founder of Epistemion, building governed
      agentic-AI systems and automation for clients.
  - id: fitness
    label: Fitness
    title: Personal Trainer & Coach
    summary: >-
      Founded and ran Approachable Fitness (2019–2026, now closed), a client-centered personal training business that
      helped clients aged 13 to 70+ reach goals “big” or “small.” NASM-certified
      trainer, purple belt in Brazilian jiu-jitsu and obstacle-course racer.

