views:
  - id: all
    label: Everything
    title: Chemist · Engineer · Developer · Founder
    summary: >-
      Scientist and engineer with 10+ years turning laboratory science into working systems — plasma
      reactors, a DOE-funded CO₂-capture pilot lab, and enterprise data platforms for statewide water
      treatment. Co-founder of Epistemion, an industrial-automation and agentic-AI company. I sit where
      chemistry, hardware and software meet, and I like shipping things people actually use.
  - id: science
    label: Science
    title: Analytical & Plasma Chemist
    summary: >-
      Research scientist with 10+ years across analytical chemistry, biochemistry and plasma chemistry.
      Hands-on with HPLC, GC-MS, LC-MS, UV-Vis and isotope-ratio mass spectrometry — operation, method
      development, maintenance and repair. Published in Biochemistry and JCI Insight; now leading
      plasma-based synthesis research focused on CO₂ utilization.
  - id: engineering
    label: Engineering
    title: Engineer & Systems Analyst
    summary: >-
      Applied engineer who designs, builds and troubleshoots physical systems — plasma reactors,
      industrial water-treatment infrastructure and pilot-scale CO₂ capture. I prototype fixtures and
      measurement rigs by hand, model fluid flow, heat transfer and electromagnetics in Python, and
      iterate until the system performs.
  - id: data
    label: Data & Software
    title: Data Scientist & Software Developer
    summary: >-
      Developer and data scientist who builds tools for real operations: a multi-platform Flutter app
      that cut statewide reporting time 50%, a 50-year water-treatment research database built with
      AI-powered OCR, and scientific simulation software. Co-founder of Epistemion, building governed
      agentic-AI systems and automation for clients.
  - id: fitness
    label: Fitness
    title: Personal Trainer & Coach
    summary: >-
      Founder of Approachable Fitness (2019–2026), a client-centered personal training business that
      helped people of every background and fitness level reach goals “big” or “small.” NASM-certified
      trainer, Brazilian jiu-jitsu competitor and obstacle-course racer.

