# Short, answer-first Q&A. Rendered visibly on the homepage and as FAQPage schema
# so search engines and AI assistants can quote it directly.
- q: Who is Mark Eschbach II?
  a: Mark Eschbach II is a multidisciplinary chemist, engineer and software developer based in Champaign, Illinois, and the co-founder of Epistemion LLC. Curious across chemistry, plasma physics, software, AI, philosophy and fitness, he is a builder at heart, with 10+ years turning research into working systems.
- q: What does Mark Eschbach II work on?
  a: He leads plasma-chemistry research on reactors for CO₂ utilization at the Prairie Research Institute (University of Illinois Urbana-Champaign), builds water-treatment data systems at the Illinois Sustainable Technology Center, and builds industrial automation and agentic-AI systems at Epistemion.
- q: What is Epistemion?
  a: Epistemion LLC is an engineering firm in Champaign, Illinois, founded in 2025 by Mark Eschbach II and Pete Norcross. It builds industrial and commercial automation, control-system software, dashboards, custom applications and governed agentic AI. Website — epistemion.com.
- q: What does Mark Eschbach II write about?
  a: Philosophy, meaning, hope and the forces that shape our world — essays such as “The House We Built,” “Hope as Our Deepest Orientation” and “What We Make” — plus detailed DIY build logs like a scrap-wood sauna and AC-chilled cold plunges.
- q: How can I contact Mark Eschbach II?
  a: By email (listed on his résumé page) or on LinkedIn. For automation or AI projects, contact Epistemion through epistemion.com.
