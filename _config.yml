markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

collections:
  writing:
    output: true
    permalink: /writing/:name/
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: writing }
    values: { layout: article, section: writing }
  - scope: { path: "", type: projects }
    values: { layout: article, section: projects }
  - scope: { path: "" }
    values: { layout: page }

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

feed:
  collections:
    - writing
    - projects

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - "**/.ipynb_checkpoints"
  - data_assets/ipy_nb
