<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <p class="footer-name">Mark Eschbach II</p>
      <p class="muted">{{ site.tagline }} · {{ site.author.location }}</p>
    </div>
    <ul class="footer-links">
      <li><a href="mailto:{{ site.author.email }}">Email</a></li>
      <li><a href="{{ site.author.linkedin }}" rel="me noopener" target="_blank">LinkedIn</a></li>
      <li><a href="{{ site.author.github }}" rel="me noopener" target="_blank">GitHub</a></li>
      <li><a href="https://epistemion.com" target="_blank" rel="noopener">Epistemion</a></li>
      <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
    </ul>
  </div>
  <div class="wrap"><p class="muted small">© {{ site.time | date: "%Y" }} Mark Eschbach II</p></div>
</footer>
